# Odoo 19 Community + PostgreSQL, for a single-user local install.
#
# Images are pinned to a dated tag rather than `19.0`, which is a moving pointer — an
# unattended `docker compose pull` on a floating tag can change the application version
# under a live database and force an upgrade nobody asked for.
#
# Both images have native linux/arm64 builds, so this runs at full speed on Apple Silicon
# with no qemu emulation.

services:
  db:
    # pgvector rather than stock postgres: the price archive's embeddings live in the same
    # database as the Odoo records they describe, so a similarity search is an ordinary SQL
    # join instead of a second datastore to keep in sync (which is what ChromaDB was).
    image: pgvector/pgvector:pg16
    container_name: redcube-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in odoo/.env}
      # Odoo creates and drops databases itself, so it needs the template to be predictable.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Odoo crashes on boot if Postgres is merely *started* rather than accepting
      # connections, so the dependency below waits on this rather than on the container.
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    # Built from ./Dockerfile — stock Odoo plus the parsing/embedding stack.
    build:
      context: .
    image: redcube/odoo:19
    container_name: redcube-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback only. This is a single-user install holding client pricing and
      # contact details; it has no business listening on the LAN until we deliberately
      # decide it should.
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in odoo/.env}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons
      # The exported ONNX embedding model (~91 MB). Mounted rather than baked into the
      # image so re-exporting it does not mean a rebuild.
      - ../models:/opt/models:ro
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
