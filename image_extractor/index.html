<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Document Image Extractor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Document Image Extractor</h1>
      <p class="sub">Pulls every embedded image out of Excel, Word and PDF files.</p>
    </div>
    <div class="topbar-actions">
      <button id="btn-choose" class="btn primary">Choose Documents</button>
      <button id="btn-clear" class="btn ghost">Clear</button>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <div class="dropzone-inner">
        <span class="dz-title">Drop documents here</span>
        <span class="dz-hint">.xlsx &nbsp;·&nbsp; .xlsm &nbsp;·&nbsp; .docx &nbsp;·&nbsp; .pdf</span>
        <span class="dz-hint">Click a result to view it · Copy to put it on the clipboard</span>
      </div>
    </section>

    <section id="queue" class="panel hidden">
      <h2>Documents read</h2>
      <ul id="queue-list" class="queue-list"></ul>
    </section>

    <section id="summary" class="summary hidden">
      <span id="summary-counts" class="counts"></span>
      <div class="summary-actions">
        <button id="btn-copy-all" class="btn ghost">Copy All Paths</button>
        <button id="btn-outdir" class="btn ghost">Output Folder…</button>
        <button id="btn-export" class="btn primary">Export Images</button>
        <button id="btn-reveal" class="btn ghost hidden">Open Folder</button>
      </div>
    </section>

    <section id="warnings" class="panel warn hidden">
      <h2>Notes</h2>
      <ul id="warning-list"></ul>
    </section>

    <section id="results" class="grid"></section>

    <section id="empty" class="empty">
      Nothing read yet. Drop a document above, or choose one.
    </section>
  </main>

  <!-- Viewer. A panel over the window rather than a fullscreen takeover: big enough to
       actually read a drawing, small enough that the grid stays visible behind it. -->
  <div id="viewer" class="viewer">
    <div class="viewer-panel">
      <div class="viewer-bar">
        <div class="viewer-meta">
          <span id="viewer-src" class="viewer-src"></span>
          <span id="viewer-loc" class="viewer-loc"></span>
        </div>
        <div class="viewer-actions">
          <span id="viewer-count" class="viewer-count"></span>
          <button id="viewer-prev" class="btn ghost small" type="button" title="Previous (←)">‹</button>
          <button id="viewer-next" class="btn ghost small" type="button" title="Next (→)">›</button>
          <button id="viewer-copy" class="btn primary small" type="button">Copy</button>
          <button id="viewer-close" class="btn ghost small" type="button" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="viewer-stage"><img id="viewer-img" alt=""></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
